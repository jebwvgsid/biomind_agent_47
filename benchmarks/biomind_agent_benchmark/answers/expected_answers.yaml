answer_set_id: biomind-agent-benchmark-expected-answers
version: 0.3.1
source_alignment:
  reference_paper: Empowering AI data scientists using a multi-agent LLM framework with self-evolving capabilities for autonomous, tool-aware biomedical data analyses
  reference_benchmark: BioMed-AQA
  open_benchmark_url: https://huggingface.co/datasets/BOBQWERA/biomed-aqa-dataset
  mcq_benchmark_url: https://huggingface.co/datasets/BOBQWERA/biomed-mcq-dataset
  input_and_milestone_files_url: https://doi.org/10.5281/zenodo.17430550
  code_url: https://github.com/BOBQWERA/BioMedAgent
  open_benchmark_rows: 327
  mcq_benchmark_rows: 172
  adapted_fields:
    task_classification: category
    question: prompt
    reference_steps: required_reference_steps
    reference_milestones: reference_milestones
    files: data_files
    milestone_reference_files: expected_artifacts
    question_type: question_type
    result_choice: result_question.correct_answer
  adaptation_note: >
    BioMind keeps the BioMed-AQA open-task shape but adds explicit fixture paths,
    skill-selection scoring, metric extraction, and final result-choice scoring.

active_data_policy:
  accepted_sources:
    - public downloaded and checksummed demo/database subsets
    - msprime professional simulation
    - deterministic msprime-derived functional annotation for enrichment mechanics
    - planned ONT methylation fixture once copied into fixtures_public/ont_methylation_modkit
  inactive_sources:
    - hand-written toy NumPy/Pandas synthetic fixtures
    - deletable results/ outputs

open_task_answers:
  BM-SCRNA-PBMC-QC-001:
    question: PBMC3k ingest and QC with fixture-path validation and result choice.
    task_classification: single_cell_rnaseq
    task_abbr: PBMC3k scRNA ingest and QC result choice
    question_type: result_choice_after_analysis
    execution_mode: full
    difficulty: easy
    answer_type: data_analysis_result_choice
    expected_skills:
      - scrna/env/bootstrap
      - scrna/ingest/data-download
      - scrna/qc/filter
    optional_skills:
      - scrna/workflows/ingest-qc
    forbidden_skills:
      - crop-breeding/crop-rnaseq-de
      - sequence/search/remote-blast
    required_reference_steps:
      - Validate PBMC3k fixture paths.
      - Use scRNA ingest/QC skills.
      - Read matrix and QC summaries.
      - Produce QC evidence.
      - Choose the evidence-supported result.
    reference_milestones:
      - Validates all explicit PBMC3k file paths.
      - Selects scRNA ingest and QC skills, with optional workflow wrapper.
      - Produces or inspects QC evidence from matrix and cell metrics.
      - Checks key dimensions and total-count metrics against the answer key.
      - Chooses the correct result option from the evidence.
    expected_artifacts:
      - raw_seurat_object.rds or matrix validation summary
      - qc_report.tsv or qc_metrics_summary.json
      - selected_result_answer.txt
    expected_metrics:
      matrix_shape_genes_by_cells: must match answer_key.yaml
      total_counts: must match answer_key.yaml
      qc_metrics_rows: must match the number of barcodes
    numeric_tolerances:
      matrix_shape: exact
      total_counts: exact
    result_question:
      correct_answer: A
    scoring:
      total_points: 5
      pass_threshold: 4
      hard_failures:
        - claims QC completion without validating matrix/features/barcodes
        - uses bulk RNA-seq or BLAST skills as the primary workflow
        - chooses an option unsupported by the fixture evidence

