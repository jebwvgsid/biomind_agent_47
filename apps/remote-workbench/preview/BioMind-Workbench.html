  <title>BioMind 远程工作台 · 演示模式</title>
  <style>:root {
  color-scheme: light;
  --bg: #ffffff; --sidebar: #f4f6f5; --panel: #fafbfa; --soft: #f3f5f4;
  --text: #28352f; --muted: #77817b; --line: #e5e9e6; --hover: #ebefec;

  font-family: "Segoe UI", "Noto Sans CJK SC", "Microsoft YaHei", "PingFang SC", sans-serif;
  font-size: 13px; color: var(--text); background: var(--bg); font-synthesis: none;
}
:root[data-theme="dark"] {
  color-scheme: dark; --bg: #202523; --sidebar: #191e1c; --panel: #1d2220; --soft: #292f2c;
  --text: #d9e1dc; --muted: #98a89e; --line: #343e37; --hover: #303a33;
  --accent: #9bccaf; --accent-soft: #293e31; --amber: #dab677; --amber-bg: #343023;

}
* { box-sizing: border-box; }
body { margin: 0; }
button, input, textarea, select { font: inherit; }
button { color: inherit; cursor: pointer; border: 0; background: none; }
button, select, input { -webkit-tap-highlight-color: transparent; }

button:not(:disabled), select { transition: background 120ms, border-color 120ms; }
button:hover:not(:disabled) { background: var(--hover); }
svg { flex-shrink: 0; vertical-align: middle; }
pre, code, .mono { font-family: Consolas, "Noto Sans Mono CJK SC", "Microsoft YaHei", monospace; }
pre { white-space: pre-wrap; overflow-wrap: anywhere; tab-size: 2; }

.muted { color: var(--muted); font-size: 12px; }
.wrap { overflow-wrap: anywhere; }
.shell { height: 100dvh; height: 100vh; display: grid; grid-template-columns: 242px minmax(0, 1fr) 326px; grid-template-rows: 56px 39px minmax(0,1fr) auto; grid-template-areas: "sidebar top top" "sidebar demo demo" "sidebar thread detail" "sidebar composer detail"; overflow: hidden; }
.shell.panel-closed { grid-template-columns: 242px minmax(0, 1fr) 0; }
.shell.panel-closed .detail { display: none; }
.sidebar { grid-area: sidebar; background: var(--sidebar); border-right: 1px solid var(--line); display: flex; flex-direction: column; padding: 25px 14px 0; min-height: 0; }
.brand { display: flex; align-items: center; gap: 10px; padding: 0 9px 28px; }

.brand div > span { font-size: 10px; letter-spacing: 2.1px; color: var(--muted); }
.version { font-size: 9px; color: var(--muted); border: 1px solid var(--line); border-radius: 4px; margin-left: auto; padding: 2px 4px; }
.primary, .secondary { display: inline-flex; align-items: center; justify-content: center; gap: 7px; border-radius: 7px; padding: 9px 13px; line-height: 1.5; white-space: nowrap; font-weight: 550; }

.small { padding: 6px 11px; font-size: 12px; }

.top-actions { display: flex; gap: 16px; align-items: center; flex-shrink: 0; }.connection { display: flex; align-items: center; gap: 5px; font-size: 11px; color: var(--accent); }
.connection-interrupted { color: var(--amber); }.connection-disconnected { color: var(--muted); }.sidebar-toggle { display: none; }

.demo-label { display: flex; align-items: center; gap: 8px; font-size: 11px; color: var(--amber); }.demo-label strong { font-weight: 600; }.demo-description { color: var(--muted); margin-left: 5px; }

.demo-controls { display: flex; align-items: center; gap: 10px; font-size: 10px; color: var(--muted); }.demo-controls select { max-width: 165px; font-size: 11px; color: var(--amber); }

.transcript > * { max-width: 805px; margin-left: auto; margin-right: auto; }
.conversation-header { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding-bottom: 20px; }.eyebrow { font-size: 10px; color: var(--muted); display: flex; align-items: center; gap: 6px; letter-spacing: .3px; }
h1 { font-size: 19px; font-weight: 600; letter-spacing: -.4px; margin: 7px 0 0; overflow-wrap: anywhere; }

.status i { width: 5px; height: 5px; border-radius: 50%; background: currentColor; }.status-awaiting_plan, .status-awaiting_script, .status-stop_requested { background: var(--amber-bg); color: var(--amber); border-color: #b693492d; }.status-running, .status-completed { background: var(--accent-soft); color: var(--accent); border-color: #32695120; }.status-recovering { background: var(--red-bg); color: var(--red); }
.conversation-date { display: flex; align-items: center; gap: 16px; color: #99a29d; font-size: 9px; padding: 3px 0 27px; }.conversation-date::before, .conversation-date::after { content: ''; height: 1px; background: var(--line); flex: 1; }
.message { display: flex; gap: 13px; margin-bottom: 26px; }.message-avatar { flex-shrink: 0; width: 27px; height: 27px; display: grid; place-items: center; border-radius: 8px; background: var(--soft); color: var(--muted); font-size: 11px; }.message-avatar svg { width: 27px; height: 27px; }

.message-text { margin: 7px 0 11px; font-size: 13px; line-height: 1.95; white-space: pre-wrap; overflow-wrap: anywhere; }.reference-chips { display: flex; gap: 6px; flex-wrap: wrap; }.file-chip { display: inline-flex; gap: 5px; align-items: center; border: 1px solid var(--line); border-radius: 5px; font-size: 10px; color: var(--muted); background: var(--panel); padding: 4px 6px; }.file-chip button { display: grid; place-items: center; padding: 0 1px; }
.assistant-work { padding-left: 40px; }.tool-activity { display: flex; gap: 7px; align-items: center; font-size: 10px; color: var(--muted); margin: -5px 0 16px; flex-wrap: wrap; }.tool-activity > svg { color: var(--accent); }.tool-activity > span:nth-child(3) { font-size: 9px; color: #9ba69e; }.text-button { padding: 2px 4px; font-size: 10px; color: var(--muted); display: inline-flex; align-items: center; gap: 3px; border-radius: 3px; }.tool-activity .text-button { margin-left: auto; }
.plan-card { border: 1px solid var(--line); border-radius: 9px; margin-bottom: 14px; background: var(--bg); overflow: hidden; }summary { cursor: pointer; list-style: none; }summary::-webkit-details-marker { display: none; }summary > svg:last-child { margin-left: auto; color: var(--muted); transition: transform 150ms; }details[open] > summary > svg:last-child { transform: rotate(180deg); }.plan-card > summary { display: flex; align-items: center; gap: 10px; padding: 14px 16px; }.card-icon { width: 31px; height: 31px; display: grid; place-items: center; border-radius: 7px; background: var(--soft); color: var(--accent); }.card-heading { display: grid; gap: 5px; }.card-heading strong { font-size: 12px; font-weight: 600; }.card-heading small { font-size: 10px; color: var(--muted); }.subtle-tag { font-size: 9px; color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 2px 5px; margin-left: auto; white-space: nowrap; }
.plan-steps { list-style: none; margin: 0; padding: 1px 16px 15px; display: grid; gap: 13px; }.plan-steps li { display: flex; gap: 10px; align-items: center; }.step-index { width: 20px; height: 20px; border: 1px solid var(--line); border-radius: 50%; display: grid; place-items: center; font-size: 9px; color: var(--muted); flex-shrink: 0; }.step-completed .step-index { color: var(--accent); background: var(--accent-soft); border-color: transparent; }.step-running .step-index { color: var(--accent); border-color: var(--accent); }.step-failed .step-index { color: var(--red); }.plan-steps li > div { display: grid; gap: 4px; }.plan-steps strong { font-size: 11px; font-weight: 500; }.plan-steps small { font-size: 10px; color: var(--muted); }.tool-name { margin-left: auto; font-size: 10px; color: var(--muted); }

.script-disclosure { border: 1px solid var(--line); border-radius: 6px; background: var(--bg); margin-bottom: 15px; overflow: hidden; }.script-disclosure summary { display: flex; align-items: center; gap: 6px; font-size: 11px; padding: 10px; }.script-disclosure summary > span { font-size: 9px; margin-left: auto; color: var(--muted); }.script-disclosure summary > svg:last-child { margin-left: 5px; }.code-block { padding: 14px; margin: 0; background: var(--code-bg); color: var(--text); font-size: 10px; line-height: 1.9; overflow-x: auto; }.script-identity { padding: 6px 10px; color: var(--muted); font-size: 9px; overflow-wrap: anywhere; }
.card-footer { border-top: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; padding: 12px 0; }.card-footer > span { display: inline-flex; align-items: center; gap: 5px; font-size: 9px; color: var(--muted); }.button-group { display: flex; gap: 7px; margin-left: auto; }.plan-card .card-footer { padding: 12px 16px; }.approved-label { color: var(--accent) !important; }

.run-strip { display: flex; gap: 10px; align-items: center; padding: 16px 0; }.run-strip > div { display: grid; gap: 6px; flex: 1; }.run-strip strong { font-size: 11px; font-weight: 500; }.run-strip small { color: var(--muted); font-size: 10px; }.activity-dot { width: 7px; height: 7px; background: var(--accent); border-radius: 50%; box-shadow: 0 0 0 4px var(--accent-soft); }.approval-hint { text-align: center; font-size: 10px; color: var(--muted); margin-top: 16px; }.stopped-note { font-size: 11px; padding: 14px; background: var(--soft); border-radius: 6px; }.conversation-end { height: 5px; }
.composer { grid-area: composer; padding: 13px clamp(20px,3.2vw,55px) 14px; background: var(--bg); position: relative; }.composer::before { content: ''; position: absolute; top: -18px; left: 0; right: 0; height: 18px; background: linear-gradient(transparent,var(--bg)); pointer-events: none; }.composer-box, .composer-footnote { max-width: 805px; margin: auto; }.composer-box { border: 1px solid #ced8d1; border-radius: 12px; padding: 11px 13px 9px; box-shadow: 0 3px 8px #20342806; }.composer-box:focus-within { border-color: #7ba08b; box-shadow: 0 0 0 2px #32695108; }.draft-references { display: flex; gap: 5px; flex-wrap: wrap; }.draft-references:not(:empty) { margin-bottom: 6px; }textarea { border: 0; resize: vertical; width: 100%; display: block; min-height: 58px; max-height: 180px; padding: 2px; outline: 0 !important; line-height: 1.8; font-size: 12px; }textarea::placeholder { color: #98a29b; }.composer-actions { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 5px; }.attach-button { display: flex; align-items: center; gap: 5px; color: var(--muted); padding: 5px; font-size: 10px; border-radius: 5px; white-space: nowrap; }.composer-right { display: flex; align-items: center; gap: 10px; }.input-hint, .queue-caption { font-size: 9px; color: #97a199; }.queue-caption { color: var(--amber); }.send-button { width: 30px; height: 30px; display: grid; place-items: center; background: #326951; color: white; border-radius: 8px; }.send-button:hover:not(:disabled) { background: #26563f; }.send-button:disabled { background: var(--hover); color: var(--muted); opacity: 1; }.composer-footnote { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 5px; font-size: 8px; padding-top: 9px; color: var(--muted); }.composer-footnote > div { display: flex; gap: 5px; }.composer-footnote button { padding: 0; font-size: 8px; text-decoration: underline; text-underline-offset: 3px; }
