benchmark_id: biomind-agent-benchmark
version: 0.3.1
created: 2026-06-02
description: >
  Data-backed BioMind benchmark tasks following the BioMed-AQA shape. Each task
  requires explicit fixture-path validation, correct skill selection, real
  analysis or evidence-based blocking, metric extraction, and a final result
  choice.

default_scoring:
  total_points: 5
  pass_threshold: 4
  hard_failures:
    - "fabricates missing input files or claims outputs were produced without evidence"
    - "selects a forbidden skill for the primary analysis"
    - "ignores failed, empty, or incompatible outputs and reports success"
    - "chooses a result answer without reading generated metrics or answer keys"

tasks:
  - id: BM-SCRNA-PBMC-QC-001
    title: "PBMC3k scRNA ingest and QC result choice"
    category: single_cell_rnaseq
    question_type: result_choice_after_analysis
    execution_mode: full
    difficulty: easy
    prompt: >
      Use the PBMC3k 10x fixture at
      benchmarks/biomind_agent_benchmark/fixtures_public/pbmc3k_10x_subset/matrix.mtx,
      benchmarks/biomind_agent_benchmark/fixtures_public/pbmc3k_10x_subset/features.tsv,
      benchmarks/biomind_agent_benchmark/fixtures_public/pbmc3k_10x_subset/barcodes.tsv,
      benchmarks/biomind_agent_benchmark/fixtures_public/pbmc3k_10x_subset/cell_qc_metrics.tsv,
      and benchmarks/biomind_agent_benchmark/fixtures_public/pbmc3k_10x_subset/answer_key.yaml.
      Validate the files, build or inspect the Seurat-ready count matrix, perform
      QC filtering, summarize cell/gene/count/percent.mt evidence, and choose the
      result option that best matches the fixture.
    data_files:
      - path: benchmarks/biomind_agent_benchmark/fixtures_public/pbmc3k_10x_subset/matrix.mtx
        role: 10x sparse count matrix
        availability: available
      - path: benchmarks/biomind_agent_benchmark/fixtures_public/pbmc3k_10x_subset/features.tsv
        role: gene feature table
        availability: available
      - path: benchmarks/biomind_agent_benchmark/fixtures_public/pbmc3k_10x_subset/barcodes.tsv
        role: cell barcode table
        availability: available
      - path: benchmarks/biomind_agent_benchmark/fixtures_public/pbmc3k_10x_subset/cell_qc_metrics.tsv
        role: precomputed QC metrics for result checking
        availability: available
      - path: benchmarks/biomind_agent_benchmark/fixtures_public/pbmc3k_10x_subset/answer_key.yaml
        role: fixture dimensions and expected summary statistics
        availability: available
    expected_skills:
      - scrna/env/bootstrap
      - scrna/ingest/data-download
      - scrna/qc/filter
    optional_skills:
      - scrna/workflows/ingest-qc
    forbidden_skills:
      - crop-breeding/crop-rnaseq-de
      - sequence/search/remote-blast
    reference_steps:
      - "Validate every PBMC3k fixture path before analysis."
      - "Use scRNA ingest/QC skills and avoid bulk RNA-seq skills."
      - "Read matrix dimensions and QC metric summaries from the fixture."
      - "Produce a QC report or metrics summary with retained-cell evidence."
      - "Choose the result option supported by the observed matrix/QC evidence."
    expected_artifacts:
      - "raw_seurat_object.rds or matrix validation summary"
      - "qc_report.tsv or qc_metrics_summary.json"
      - "selected_result_answer.txt"
    expected_metrics:
      matrix_shape_genes_by_cells: "must match answer_key.yaml"
      total_counts: "must match answer_key.yaml"
      qc_metrics_rows: "must match the number of barcodes"
    numeric_tolerances:
      matrix_shape: exact
      total_counts: exact
    result_question:
      prompt: "Which conclusion is correct after inspecting the PBMC3k fixture and QC metrics?"
      options:
        A: "The fixture is a valid 10x scRNA count matrix; QC should use cell/gene/count/percent.mt summaries before downstream clustering."
        B: "The files are bulk RNA-seq TPM tables and should be analyzed with crop-rnaseq-de."
        C: "The count matrix is missing barcodes, so cell-level QC cannot be assessed."
        D: "Remote BLAST is the primary skill because the input is a nucleotide sequence."
        E: "QC can be reported as successful without checking matrix dimensions or metrics."
      correct_answer: A
    milestones:
      - id: M1
        description: "Validates all explicit PBMC3k file paths."
        points: 1
      - id: M2
        description: "Selects scRNA ingest and QC skills, with optional workflow wrapper."
        points: 1
      - id: M3
        description: "Produces or inspects QC evidence from matrix and cell metrics."
        points: 1
      - id: M4
        description: "Checks key dimensions and total-count metrics against the answer key."
        points: 1
      - id: M5
        description: "Chooses the correct result option from the evidence."
        points: 1
    scoring:
      total_points: 5
      pass_threshold: 4
      hard_failures:
        - "claims QC completion without validating matrix/features/barcodes"
        - "uses bulk RNA-seq or BLAST skills as the primary workflow"
        - "chooses an option unsupported by the fixture evidence"

  - id: BM-SCRNA-PBMC-CLUSTER-MARKER-002
    title: "PBMC3k clustering and marker-result interpretation"
    category: single_cell_rnaseq
    question_type: result_choice_after_analysis
    execution_mode: full
    difficulty: medium
    prompt: >
      Continue from the PBMC3k fixture paths
      benchmarks/biomind_agent_benchmark/fixtures_public/pbmc3k_10x_subset/matrix.mtx,
      benchmarks/biomind_agent_benchmark/fixtures_public/pbmc3k_10x_subset/features.tsv,
      benchmarks/biomind_agent_benchmark/fixtures_public/pbmc3k_10x_subset/barcodes.tsv,
      and benchmarks/biomind_agent_benchmark/fixtures_public/pbmc3k_10x_subset/answer_key.yaml.
      Run or plan standard scRNA preprocessing, PCA/UMAP clustering, and
      FindAllMarkers-style marker discovery. Interpret marker outputs and choose
      the option that best reflects a valid scRNA cluster/marker analysis.
    data_files:
      - path: benchmarks/biomind_agent_benchmark/fixtures_public/pbmc3k_10x_subset/matrix.mtx
        role: 10x sparse count matrix
        availability: available
      - path: benchmarks/biomind_agent_benchmark/fixtures_public/pbmc3k_10x_subset/features.tsv
        role: gene feature table
        availability: available
      - path: benchmarks/biomind_agent_benchmark/fixtures_public/pbmc3k_10x_subset/barcodes.tsv
        role: cell barcode table
        availability: available
      - path: benchmarks/biomind_agent_benchmark/fixtures_public/pbmc3k_10x_subset/answer_key.yaml
        role: expected fixture dimensions
        availability: available
    expected_skills:
      - scrna/preprocess/basic
      - scrna/cluster/basic
      - scrna/markers/find
    optional_skills:
      - scrna/qc/filter
    forbidden_skills:
      - scrna/de/contrast
      - crop-breeding/crop-rnaseq-de
    reference_steps:
      - "Validate PBMC3k paths and confirm a filtered or filterable scRNA count matrix."
      - "Run preprocessing before clustering."
      - "Run marker discovery only after cluster labels exist."
      - "Summarize marker table evidence such as top genes per cluster."
      - "Choose the result option that preserves correct scRNA stage order."
    expected_artifacts:
      - "preprocessed_seurat_object.rds"
      - "clustered_seurat_object.rds"
      - "marker_table.tsv"
      - "selected_result_answer.txt"
    expected_metrics:
      marker_table_nonempty: true
      cluster_labels_present: true
    numeric_tolerances:
      marker_table_rows: ">0 when execution environment is available"
    result_question:
      prompt: "Which conclusion is correct for a valid PBMC3k clustering and marker workflow?"
      options:
        A: "Preprocessing and clustering must precede marker detection; a nonempty marker table is the evidence for cluster-marker interpretation."
        B: "Differential expression between conditions should be run first even though no condition metadata is supplied."
        C: "Marker discovery is valid before creating cluster labels."
        D: "Bulk RNA-seq DESeq2 is the canonical PBMC3k clustering method."
        E: "The task is complete if UMAP is plotted but marker output is empty."
      correct_answer: A
    milestones:
      - id: M1
        description: "Validates the PBMC3k file paths."
        points: 1
      - id: M2
        description: "Selects preprocess, cluster, and marker skills."
        points: 1
      - id: M3
        description: "Maintains correct stage order."
        points: 1
      - id: M4
        description: "Uses marker-table evidence for interpretation."
        points: 1
      - id: M5
        description: "Chooses the correct result option."
        points: 1
    scoring:
      total_points: 5
      pass_threshold: 4
      hard_failures:
        - "runs condition DE without condition metadata"
        - "runs marker discovery before clustering"
        - "uses bulk RNA-seq skills for PBMC3k clustering"

  - id: BM-3DDNA-COOL-TAD-003
    title: "Cooler Hi-C TAD analysis result choice"
    category: chromatin_contact_tad
    question_type: result_choice_after_analysis
    execution_mode: full
    difficulty: medium
    prompt: >
      Use the Hi-C cooler fixture
      benchmarks/biomind_agent_benchmark/fixtures_public/cool_hg19_gm12878_chr22/hg19_GM12878_MboI_chr22_2Mb.cool
      plus benchmarks/biomind_agent_benchmark/fixtures_public/cool_hg19_gm12878_chr22/answer_key.yaml.
      Validate the cooler resolution and chromosome metadata, run or plan TAD
      calling with HiCExplorer-compatible checks, summarize TAD domains and
      boundaries, and choose the result option supported by the matrix evidence.
    data_files:
      - path: benchmarks/biomind_agent_benchmark/fixtures_public/cool_hg19_gm12878_chr22/hg19_GM12878_MboI_chr22_2Mb.cool
        role: balanced Hi-C cooler matrix
        availability: available
      - path: benchmarks/biomind_agent_benchmark/fixtures_public/cool_hg19_gm12878_chr22/answer_key.yaml
        role: cooler expected dimensions and counts
        availability: available
    expected_skills:
      - 3d-dna/3d-dna-analysis
      - 3d-dna/tad-calling
    optional_skills: []
    forbidden_skills:
      - 3d-dna/loop-classification
      - genomics/wgs-variant-calling
    reference_steps:
      - "Validate the .cool path and load answer-key matrix metadata."
      - "Route through the 3D DNA entry skill and TAD-calling skill."
      - "Check matrix resolution, balance/readability, and chromosome scope."
      - "Run or plan TAD calling and summarize domain/boundary statistics."
      - "Choose the result option that matches a TAD analysis rather than loop classification or WGS."
    expected_artifacts:
      - "tad_domains.tsv"
      - "tad_boundaries.tsv"
      - "tad_domain_stats.tsv"
      - "selected_result_answer.txt"
    expected_metrics:
      cooler_bin_size: "must match answer_key.yaml"
      cooler_nnz: "must match answer_key.yaml"
    numeric_tolerances:
      cooler_metadata: exact
      tad_count: ">=0; empty TAD calls must be reported honestly"
    result_question:
      prompt: "Which conclusion is correct for this cooler fixture?"
      options:
        A: "The .cool matrix should be validated for resolution/count metadata before TAD calling; TAD outputs are domains, boundaries, and summary statistics."
        B: "The correct first step is loop-anchor classification because no loop calls exist yet."
        C: "The matrix should be treated as a VCF and sent to GATK."
        D: "Resolution can be guessed without inspecting the cooler metadata."
        E: "A TAD result is valid even if matrix loading fails."
      correct_answer: A
    milestones:
      - id: M1
        description: "Validates cooler and answer-key paths."
        points: 1
      - id: M2
        description: "Selects 3D DNA router and TAD-calling skills."
        points: 1
      - id: M3
        description: "Checks resolution and matrix metadata."
        points: 1
      - id: M4
        description: "Produces or honestly blocks TAD domain/boundary artifacts."
        points: 1
      - id: M5
        description: "Chooses the correct result option."
        points: 1
    scoring:
      total_points: 5
      pass_threshold: 4
      hard_failures:
        - "guesses resolution without checking cooler metadata"
        - "uses loop classification before loop calls"
        - "claims TAD results when matrix loading fails"

  - id: BM-3DDNA-COOL-RESAMPLE-DIFFTAD-025
    title: "5kb cooler to 40kb TAD and differential-TAD result choice"
    category: chromatin_contact_tad
    question_type: result_choice_after_analysis
    execution_mode: full
    difficulty: hard
    prompt: >
      Use the paired Hi-C cooler fixture paths
      benchmarks/biomind_agent_benchmark/fixtures_public/cool_pair_5kb_tad/target_5kb.cool,
      benchmarks/biomind_agent_benchmark/fixtures_public/cool_pair_5kb_tad/control_5kb.cool,
      benchmarks/biomind_agent_benchmark/fixtures_public/cool_pair_5kb_tad/sample_sheet.tsv,
      and benchmarks/biomind_agent_benchmark/fixtures_public/cool_pair_5kb_tad/answer_key.yaml.
      Validate that both input matrices are 5 kb balanced coolers, coarsen or
      convert both matrices to a shared 40 kb resolution, verify the converted
      matrices, call TADs separately for target and control at 40 kb, run
      bidirectional target-control differential TAD testing with the matching
      sample-specific domain BED files, summarize accepted and rejected
      differential TAD counts, and choose the result option that matches the
      final rejected differential TAD total.
    data_files:
      - path: benchmarks/biomind_agent_benchmark/fixtures_public/cool_pair_5kb_tad/target_5kb.cool
        role: target 5 kb balanced Hi-C cooler matrix
        availability: planned
      - path: benchmarks/biomind_agent_benchmark/fixtures_public/cool_pair_5kb_tad/control_5kb.cool
        role: control 5 kb balanced Hi-C cooler matrix
        availability: planned
      - path: benchmarks/biomind_agent_benchmark/fixtures_public/cool_pair_5kb_tad/sample_sheet.tsv
        role: target/control sample sheet with expected 5 kb input and 40 kb analysis resolution
        availability: planned
      - path: benchmarks/biomind_agent_benchmark/fixtures_public/cool_pair_5kb_tad/answer_key.yaml
        role: expected conversion, TAD, and differential-TAD summary metrics
        availability: planned
    expected_skills:
      - 3d-dna/3d-dna-analysis
      - 3d-dna/tad-calling
      - 3d-dna/differential-tad
    optional_skills:
      - 3d-dna/tad-boundary-change
    forbidden_skills:
      - 3d-dna/loop-classification
      - genomics/wgs-variant-calling
    reference_steps:
      - "Validate target/control 5 kb .cool paths, sample sheet, and answer key before analysis."
      - "Confirm both matrices have the same chromosome scope, 5 kb input binsize, and usable balancing metadata."
      - "Coarsen or convert both matrices to exactly 40 kb and verify the converted binsize/count metadata."
      - "Call TADs independently for target and control using the converted 40 kb matrices."
      - "Run differential TAD testing in the target-vs-control direction using target domains."
      - "Run the reverse control-vs-target comparison using control domains, or explicitly report if bidirectional execution blocks."
      - "Read the differential TAD summary, count rejected differential TADs, and choose the matching result option."
    expected_artifacts:
      - "target_40kb.cool"
      - "control_40kb.cool"
      - "target_40kb_domains.bed and control_40kb_domains.bed"
      - "differential_tad_summary.tsv"
      - "selected_result_answer.txt"
    expected_metrics:
      input_bin_size: 5000
      output_bin_size: 40000
      coarsening_factor: 8
      target_tad_count: "must match answer_key.yaml when fixture is present"
      control_tad_count: "must match answer_key.yaml when fixture is present"
      bidirectional_rejected_differential_tads_total: "must match answer_key.yaml; planned expected value is 14"
    numeric_tolerances:
      bin_sizes: exact
      coarsening_factor: exact
      rejected_differential_tad_count: exact
    result_question:
      prompt: "After 5 kb to 40 kb conversion, 40 kb TAD calling, and bidirectional differential TAD testing, how many rejected differential TADs are reported in total?"
      options:
        A: "0 rejected differential TADs"
        B: "14 rejected differential TADs"
        C: "28 rejected differential TADs"
        D: "Only the target TAD count should be reported; differential TAD testing is not part of the workflow"
        E: "The count is valid without converting both matrices to the same 40 kb resolution"
      correct_answer: B
    milestones:
      - id: M1
        description: "Validates paired 5 kb cooler inputs, sample sheet, and answer key."
        points: 1
      - id: M2
        description: "Performs or plans evidence-backed 5 kb to 40 kb conversion for both samples."
        points: 1
      - id: M3
        description: "Calls TADs at 40 kb for target and control with sample-specific domain outputs."
        points: 1
      - id: M4
        description: "Runs or honestly blocks bidirectional differential TAD testing with matching domains."
        points: 1
      - id: M5
        description: "Chooses the rejected differential TAD count supported by the summary evidence."
        points: 1
    scoring:
      total_points: 5
      pass_threshold: 4
      hard_failures:
        - "runs differential TAD testing before generating target/control 40 kb TAD domains"
        - "compares target and control matrices at different resolutions"
        - "uses loop classification or WGS skills as the primary workflow"
        - "chooses a rejected differential TAD count without reading generated summary metrics or answer_key.yaml"

  - id: BM-CROP-METABOLOMICS-015
    title: "Crop metabolomics-only prediction result choice"
    category: crop_multiomics_prediction
    question_type: result_choice_after_analysis
    execution_mode: manual_review
    difficulty: medium
    prompt: >
      Use the crop metabolomics fixture paths
      benchmarks/biomind_agent_benchmark/fixtures_public/crop_multiomics/metabolite_matrix.tsv,
      benchmarks/biomind_agent_benchmark/fixtures_public/crop_multiomics/metabolite_sample_metadata.tsv,
      and benchmarks/biomind_agent_benchmark/fixtures_public/crop_multiomics/metabolite_answer_key.yaml.
      Validate sample and metabolite dimensions, run or plan metabolite-only
      prediction and feature interpretation, and choose the option that states
      what this fixture can and cannot prove.
    data_files:
      - path: benchmarks/biomind_agent_benchmark/fixtures_public/crop_multiomics/metabolite_matrix.tsv
        role: metabolite feature matrix
        availability: planned
      - path: benchmarks/biomind_agent_benchmark/fixtures_public/crop_multiomics/metabolite_sample_metadata.tsv
        role: metabolomics sample metadata
        availability: planned
      - path: benchmarks/biomind_agent_benchmark/fixtures_public/crop_multiomics/metabolite_answer_key.yaml
        role: metabolomics fixture expected dimensions
        availability: planned
    expected_skills:
      - crop-breeding/crop-dnngp-multiomics-prediction
    optional_skills:
      - crop-breeding/crop-smart-breeding-strategy
    forbidden_skills:
      - crop-breeding/crop-conserved-transcriptome-ml
      - crop-breeding/crop-gwas-pipeline
    reference_steps:
      - "Validate metabolite matrix and sample metadata paths."
      - "Use the DNNGP multi-omics skill for metabolite-feature prediction planning."
      - "Treat this as metabolite-only unless matched genotype/expression files are also present."
      - "Summarize feature matrix dimensions and candidate important metabolites."
      - "Choose the result option that avoids overclaiming strict matched multi-omics."
    expected_artifacts:
      - "metabolite_only_model_performance.tsv"
      - "metabolite_feature_importance.tsv"
      - "selected_result_answer.txt"
    expected_metrics:
      metabolite_samples: "must match metabolite_answer_key.yaml when present"
      metabolite_features: "must match metabolite_answer_key.yaml when present"
    numeric_tolerances:
      dimensions: exact
    result_question:
      prompt: "Which conclusion is correct for this crop_multiomics fixture?"
      options:
        A: "It supports metabolite-only prediction and metadata handling, but it cannot prove strictly matched genotype-expression-metabolite fusion by itself."
        B: "It proves full genotype-expression-metabolite fusion because all omics tables are present."
        C: "It should be analyzed with GWAS because the files are VCF/PLINK genotypes."
        D: "It should use conserved transcriptome ML because an expression matrix is present."
        E: "No sample metadata check is needed for metabolomics prediction."
      correct_answer: A
    milestones:
      - id: M1
        description: "Validates metabolomics fixture paths or reports planned-data blocker."
        points: 1
      - id: M2
        description: "Selects DNNGP multi-omics prediction skill."
        points: 1
      - id: M3
        description: "Treats available data as metabolite-only."
        points: 1
      - id: M4
        description: "Extracts matrix dimensions and model/feature evidence."
        points: 1
      - id: M5
        description: "Chooses the non-overclaiming result option."
        points: 1
    scoring:
      total_points: 5
      pass_threshold: 4
      hard_failures:
        - "claims strict matched multi-omics fusion without genotype and expression matrices"
        - "uses GWAS or transcriptome-only skills as the primary analysis"
        - "ignores missing planned fixture files"

