mcq_answers:
  BM-MCQ-001:
    type: single_select
    question: Existing TAD boundaries require boundary-change skill first.
    answer: B
    expected_skills:
      - 3d-dna/tad-boundary-change
    rationale: Existing boundaries mean downstream boundary summary, not TAD calling.
  BM-MCQ-002:
    type: single_select
    question: Private custom proteome BLAST should be local.
    answer: B
    expected_skills:
      - sequence/search/local-blast
    rationale: Private data and custom FASTA require local BLAST.
  BM-MCQ-003:
    type: single_select
    question: Public one-off sequence identification should use remote BLAST first.
    answer: B
    expected_skills:
      - sequence/search/remote-blast
    rationale: Small public exploratory searches fit remote BLAST.
  BM-MCQ-004:
    type: single_select
    question: GWAS-weighted Transformer prediction should use GP-WAITER.
    answer: B
