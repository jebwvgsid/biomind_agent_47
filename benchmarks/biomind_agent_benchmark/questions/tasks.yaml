        points: 1
      - id: M3
        description: "Uses environment time series and growth-stage windows."
        points: 1
      - id: M4
        description: "Reports reaction-norm and stable-genotype evidence."
        points: 1
      - id: M5
        description: "Chooses the correct GxE result option."
        points: 1
    scoring:
      total_points: 5
      pass_threshold: 4
      hard_failures:
        - "ignores environment time series and treats the task as SNP-only"
        - "claims stable genotype rankings without phenotype/environment evidence"
        - "uses RNA-seq or pangenome skills as the primary GxE analysis"

  - id: BM-CROP-PANGENOME-SV-018
    title: "Maize SV and ePAV pangenome-selection result choice"
    category: crop_pangenome_selection
    question_type: result_choice_after_analysis
    execution_mode: manual_review
    difficulty: hard
    prompt: >
      Use the maize pangenome fixture paths
      benchmarks/biomind_agent_benchmark/fixtures_public/maize_pangenome_sv/sv.vcf,
      benchmarks/biomind_agent_benchmark/fixtures_public/maize_pangenome_sv/pangenome_gene_presence_absence.tsv,
      benchmarks/biomind_agent_benchmark/fixtures_public/maize_pangenome_sv/pangenome_gene_presence_absence.features_by_sample.tsv,
