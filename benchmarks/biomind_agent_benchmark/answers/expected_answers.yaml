  BM-3DDNA-COOL-RESAMPLE-DIFFTAD-025:
    question: 5kb cooler to 40kb TAD calling and bidirectional differential-TAD result choice.
    task_classification: chromatin_contact_tad
    task_abbr: 5kb-to-40kb TAD and differential-TAD result choice
    question_type: result_choice_after_analysis
    execution_mode: full
    difficulty: hard
    answer_type: data_analysis_result_choice
    expected_skills:
      - 3d-dna/3d-dna-analysis
      - 3d-dna/tad-calling
      - 3d-dna/differential-tad
    optional_skills:
      - 3d-dna/tad-boundary-change
    forbidden_skills:
      - 3d-dna/loop-classification
      - genomics/wgs-variant-calling
    required_reference_steps:
      - Validate target/control 5 kb .cool paths, sample sheet, and answer key before analysis.
      - Confirm both matrices have the same chromosome scope, 5 kb input binsize, and usable balancing metadata.
      - Coarsen or convert both matrices to exactly 40 kb and verify the converted binsize/count metadata.
      - Call TADs independently for target and control using the converted 40 kb matrices.
      - Run differential TAD testing in the target-vs-control direction using target domains.
      - Run the reverse control-vs-target comparison using control domains, or explicitly report if bidirectional execution blocks.
      - Read the differential TAD summary, count rejected differential TADs, and choose the matching result option.
    reference_milestones:
      - Validates paired 5 kb cooler inputs, sample sheet, and answer key.
      - Performs or plans evidence-backed 5 kb to 40 kb conversion for both samples.
      - Calls TADs at 40 kb for target and control with sample-specific domain outputs.
      - Runs or honestly blocks bidirectional differential TAD testing with matching domains.
      - Chooses the rejected differential TAD count supported by the summary evidence.
    expected_artifacts:
      - target_40kb.cool
      - control_40kb.cool
      - target_40kb_domains.bed and control_40kb_domains.bed
      - differential_tad_summary.tsv
      - selected_result_answer.txt
    expected_metrics:
      input_bin_size: 5000
      output_bin_size: 40000
      coarsening_factor: 8
      target_tad_count: must match answer_key.yaml when fixture is present
      control_tad_count: must match answer_key.yaml when fixture is present
      bidirectional_rejected_differential_tads_total: must match answer_key.yaml; planned expected value is 14
    numeric_tolerances:
      bin_sizes: exact
      coarsening_factor: exact
      rejected_differential_tad_count: exact
    result_question:
      correct_answer: B
    scoring:
      total_points: 5
      pass_threshold: 4
      hard_failures:
        - runs differential TAD testing before generating target/control 40 kb TAD domains
        - compares target and control matrices at different resolutions
        - uses loop classification or WGS skills as the primary workflow
        - chooses a rejected differential TAD count without reading generated summary metrics or answer_key.yaml

